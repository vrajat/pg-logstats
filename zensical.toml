[project]
site_name = "pg-logstats"
site_url = "https://github.com/vrajat/pg-logstats"
site_description = "PostgreSQL log investigation CLI"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/vrajat/pg-logstats"
repo_name = "vrajat/pg-logstats"
edit_uri = "edit/main/docs/"
nav = [
  {"Overview" = [
    {"What is pg-logstats?" = "index.md"},
  ]},
  {"Setup" = [
    {"Getting Started" = "setup/index.md"},
    {"Inspect and Readiness" = "user-guide/inspect.md"},
    {"RDS & CloudWatch" = "user-guide/rds-cloudwatch.md"},
  ]},
  {"Runbooks" = [
    {"Overview" = "runbooks/index.md"},
    {"Investigation Guidance" = "user-guide/guidance.md"},
    {"Action Types" = "runbooks/action-types.md"},
    {"Slow Query Triage" = "user-guide/top-query-families.md"},
    {"Error Triage" = "user-guide/errors.md"},
    {"Temp File Triage" = "user-guide/temp-files.md"},
  ]},
  {"Development" = [
    {"Overview" = "development/index.md"},
    {"Architecture" = "development/architecture.md"},
    {"API Reference" = "reference/api.md"},
  ]},
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
]
